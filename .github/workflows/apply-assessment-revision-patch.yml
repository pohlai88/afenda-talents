name: Apply assessment revision patch

on:
  push:
    branches:
      - full-stack-integration-frontend-rebuild
    paths:
      - scripts/apply-assessment-revision-patch.mjs
      - .github/workflows/apply-assessment-revision-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-stack-integration-frontend-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: node scripts/apply-assessment-revision-patch.mjs
      - name: Commit patched editor
        run: |
          if git diff --quiet -- src/components/assessment-builder/assessment-builder.tsx; then
            echo "Assessment editor already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/assessment-builder/assessment-builder.tsx
          git commit -m "fix: serialize assessment autosave revisions"
          git push origin HEAD:full-stack-integration-frontend-rebuild
