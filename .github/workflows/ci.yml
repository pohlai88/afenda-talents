name: Production quality (manual)

# GitHub-hosted runners are currently unavailable for this repository/account.
# Keep this workflow manual-only so future PRs are not marked red by a known
# control-plane restriction. Re-enable automatic triggers only when runner
# availability and branch protection are intentionally restored.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: Manual lint, types, unit, invariants, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://preview:preview@127.0.0.1:1/preview
      DIRECT_URL: postgresql://preview:preview@127.0.0.1:1/preview
      APP_URL: http://127.0.0.1:3100
      APP_SECRET: ci-only-app-secret-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-generated-password-0123456789
      RESEND_API_KEY: ""
      MAIL_FROM: "Afenda Talents CI <noreply@example.com>"
      INVITE_TTL_DAYS: "14"
      RETENTION_DAYS: "180"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository quality gate
        run: pnpm check
